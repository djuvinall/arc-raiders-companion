name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./crates/arc-tauri/tauri.conf.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo test --workspace
      - run: npm ci
        working-directory: ui
      - name: Build the installer
        working-directory: crates/arc-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: ../../ui/node_modules/.bin/tauri build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs "$GITHUB_REF_NAME"
