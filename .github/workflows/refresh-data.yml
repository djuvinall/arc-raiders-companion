name: refresh-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p arc-ingest -- probe
      - run: cargo run -p arc-ingest -- sync --write
      - run: cargo test -p arc-core -p arc-ingest
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tests/fixtures
          git diff --cached --quiet || { git commit -m "Refresh dataset" && git push; }
