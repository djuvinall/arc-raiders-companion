# Report relay for ARC Raiders Companion. See README.md for setup.
name = "arc-companion-reports"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
GITHUB_REPO = "djuvinall/arc-raiders-data"
# Set GITHUB_APP_ID and GITHUB_PRIVATE_KEY as secrets, never here:
#   npx wrangler secret put GITHUB_APP_ID
#   npx wrangler secret put GITHUB_PRIVATE_KEY < key.pem

# Three reports per minute per IP.
[[ratelimits]]
name = "REPORTS"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60
