[workspace]
resolver = "2"
members = ["crates/arc-core", "crates/arc-ingest", "crates/arc-tauri"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
